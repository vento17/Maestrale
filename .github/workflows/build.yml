name: Build

# Manual run (builds only), or push a version tag to build AND publish a Release
# with direct-download links:  git tag v0.1.0 && git push origin v0.1.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# The release job needs write access to create the GitHub Release.
permissions:
  contents: write

jobs:
  windows:
    name: Windows (portable .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Spout/NDI sidecar is packaged with PyInstaller
      # MUST match the vendored wheels: src/main/sidecar/vendor ships numpy and
      # Pillow as cp314 binaries. On any other minor the sidecar starts but
      # cannot import them, and the released exe silently loses Spout/NDI.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build sidecar + app
        run: |
          npm run build:sidecar
          npm run build

      # package.json sets directories.output to ../MaestraleExe (outside the
      # checkout), which upload-artifact can't reach — override it to a path
      # inside the workspace for CI.
      - name: Package portable exe
        run: npx electron-builder --win portable --publish never --config.directories.output=release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Maestrale-windows-portable
          path: release/*.exe
          if-no-files-found: error

  macos:
    name: macOS (.dmg — no Spout/NDI)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci   # rebuilds @julusian/midi, koffi, serialport for macOS

      - name: Typecheck
        run: npm run typecheck

      - name: Build app
        run: npm run build

      # Uses electron-builder.mac.yml (x64 + arm64 dmgs, no sidecar). Spout/NDI
      # widgets are disabled on macOS; everything else works. Unsigned build.
      - name: Package dmgs (Intel + Apple Silicon)
        run: npx electron-builder --mac --publish never --config electron-builder.mac.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no Apple cert → skip signing

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: Maestrale-macos-dmg
          path: release/*.dmg
          if-no-files-found: error

  # On a version tag, gather the built binaries and publish a GitHub Release
  # with direct-download links (no login / no Actions navigation needed).
  release:
    name: Publish Release
    needs: [windows, macos]
    # Publish whenever both builds succeed — works for a tag push AND for a manual
    # "Run workflow", so no git tag is required to get download links.
    if: ${{ needs.windows.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # A tag push releases under that tag; a manual run refreshes a single
          # rolling "dev-build" release instead of inventing a version. These
          # were hardcoded to v0.1.0, so every later tag dumped its exe and dmgs
          # onto the old release.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'dev-build' }}
          name: ${{ github.ref_type == 'tag' && format('Maestrale {0}',  github.ref_name) || 'Maestrale dev build' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
